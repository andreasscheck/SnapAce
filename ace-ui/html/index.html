<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACE Status</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>ACE Status</h1>
    <div class="status-bar">
        Moonraker:
        <span id="connection-status" class="status-dot disconnected"></span>
        <span id="connection-text">Connecting…</span>
    </div>
</header>

<div id="ace-summary" class="ace-summary"></div>

<div id="dryer-controls" class="dryer-controls">
    <label class="dryer-field">Temp (°C)
        <input type="number" id="dryer-temp" value="55" min="1" step="1">
    </label>
    <label class="dryer-field">Duration (min)
        <input type="number" id="dryer-duration" value="240" min="1" step="1">
    </label>
    <button id="dryer-start-btn" class="dryer-btn">Start Drying</button>
    <button id="dryer-stop-btn" class="dryer-btn stop">Stop Drying</button>
</div>

<section id="gate-map" class="gate-map">
    <div class="gate-map-header">
        <h2>Gate Mapping</h2>
        <span id="gate-map-source" class="gate-map-source"></span>
    </div>
    <div id="gate-map-rows" class="gate-map-rows"></div>
    <div id="gate-map-hint" class="gate-map-hint"></div>
    <div class="gate-map-actions">
        <button id="gate-map-save-btn" class="dryer-btn">Save Mapping</button>
        <button id="gate-map-reset-btn" class="dryer-btn stop">Reset to ace.cfg</button>
    </div>
    <div id="gate-map-restart" class="gate-map-restart" hidden>
        <span>Saved mapping takes effect after a Klipper restart.</span>
        <button id="gate-map-restart-btn" class="dryer-btn">Restart Klipper now</button>
    </div>
</section>

<main class="content">
    <div id="gates-grid" class="gates-grid"></div>
    <div id="status-message" class="status-message"></div>
</main>

<script src="script.js"></script>
</body>
</html>
